# Memory for the Gradle daemon. 4 GB is enough for this app; the template's
# 8 GB makes laptops with 8-16 GB RAM swap, which is much slower.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2G

# Faster builds: reuse outputs from earlier builds, build modules in
# parallel, keep the daemon warm (no configuration cache: the Flutter plugin doesn't support it).
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
kotlin.incremental=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
